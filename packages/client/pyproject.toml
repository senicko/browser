[project]
name = "client"
version = "0.1.0"
description = "Client responsible for running the browser models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "joblib>=1.5.3",
    "model",
]

[tool.uv.sources]
model = { workspace = true }

[project.scripts]
run-client = "client.main:main"
